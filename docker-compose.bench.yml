# ARTEX 텐센트 TSec Benchmark 평가 거울 —— 로컬 원클릭 build + run。
# 및 제작용 docker-compose.yml(다양한 서비스:artex+postgres)서로 영향을 미치지 않습니다。
# 사용법：
#   cp bench/.env.example bench/.env   # 작성하세요 LLM_API_KEY / BENCHMARK_TOKEN 등
#   docker compose -f docker-compose.bench.yml up --build      # 포그라운드에서 빌드 및 실행(로그 읽기)
#   docker compose -f docker-compose.bench.yml up --build -d   # 백스테이지
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 그만하세요(추가 -v 다음과 같은 데이터 볼륨을 삭제합니다.)
# 브라우저：http://localhost:8787（사용 ADMIN_PASSWORD 로그인）

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 실제 머신과 네트워크 공유：컨테이너는 호스트 네트워크 스택을 직접 사용합니다.，호스트에 직접 연결 가능/VPN 의 대상 드론 네트워크。
    # host 모드에서는 사용되지 않습니다. ports 매핑，컨테이너가 호스트 포트에 직접 바인딩됩니다.：8787(UI/API)、8788(대리인)、
    # 및 내부적으로 PostgreSQL 5432 —— 호스트의 이 세 포트가 사용 가능한지 확인하십시오.（로컬 테스트 전에 이를 점유하는 서비스를 중지하십시오.）。
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
