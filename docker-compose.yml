services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?부탁드려요 .env 설정 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    image: autumn27/artex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # 데이터 디렉토리를 넣어주세요（포함 jwt.key、SQLite 등）프로젝트 루트 디렉터리에 바인딩됨 data/，
      # 호스트 머신에서 직접 볼 수 있어 편리함/백업，컨테이너를 다시 만들어도 유실되지는 않습니다。
      - ./data:/app/data
      # 프로젝트 루트 디렉터리를 변경합니다. skills 용기에 매달아 두세요（내장 이미지 덮어쓰기 /app/skills）；
      # 변경 skill 이미지를 다시 빌드할 필요가 없습니다.，컨테이너가 호스트를 읽습니다.。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
